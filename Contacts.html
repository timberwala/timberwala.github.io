<script>
  function StopEventPropagation(event) {
    if (event.stopPropagation) {

</script>

<script>
  window.addEventListener("DOMContentLoaded", function() {

    // get the form elements defined in your form HTML above
    
    var form = document.getElementById("my-form");
    var button = document.getElementById("my-form-button");
    var status = document.getElementById("my-form-status");
    var captchaSpinCheck= document.getElementById("captchaSpinCheck");

    // Success and Error functions for after the form is submitted
    
    function success() {
      form.reset();
      button.style = "background-color:blue";
      button.innerText = "Submitted";
      var msg = (window.CW_I18N && window.CW_I18N.t) ? window.CW_I18N.t("contact.form_success") : "Thanks For Contacting CenturyWood Timbers. We will Get You Shortly";
      status.innerHTML = "<h3>" + msg + "</h3>";
      captchaSpinCheck.disabled = false;
     
    }

    function error() {
      status.innerHTML = (window.CW_I18N && window.CW_I18N.t) ? window.CW_I18N.t("contact.form_error") : "Oops! There was a problem.";
    }

    // handle the form submission event

    form.addEventListener("submit", function(ev) {
      ev.preventDefault();
      var data = new FormData(form);
      ajax(form.method, form.action, data, success, error);
    });
  });
  
  // helper function for sending an AJAX request

  function ajax(method, url, data, success, error) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, url);
    xhr.setRequestHeader("Accept", "application/json");
    xhr.onreadystatechange = function() {
      if (xhr.readyState !== XMLHttpRequest.DONE) return;
      if (xhr.status === 200) {
        success(xhr.response, xhr.responseType);
      } else {
        error(xhr.status, xhr.response, xhr.responseType);
      }
    };
    xhr.send(data);
  }
</script>
